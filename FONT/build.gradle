plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'edu.sc.seis.launch4j' version '3.0.5'
}

javafx {
    version = "21.0.2"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

// Configuración de Launch4j para crear .exe de Windows
launch4j {
    mainClassName = 'presentation.main.MainLauncher'
    icon = "${projectDir}/../DATA/img/icon/logo.ico"
    outfile = 'K-SURVEYS.exe'
    outputDir = "${projectDir}/../EXE"
    jarTask = project.tasks.jar
    
    // Configuración del JRE
    bundledJrePath = 'jre'
    requires64Bit = true
    jreMinVersion = '21'
    
    // Información del ejecutable
    headerType = 'gui'
    
    // Metadatos del archivo
    fileDescription = 'K-SURVEYS - Aplicación de Encuestas'
    productName = 'K-SURVEYS'
    companyName = 'PROP UPC'
    copyright = '2025'
    version = '1.0.0'
    textVersion = '1.0.0'
}

group = 'presentation.main'
version = '1.0-SNAPSHOT'

application {
    mainClass = 'presentation.main.Main'
}

// Configuración para copiar dependencias JavaFX y no-JavaFX por separado
configurations {
    javafxLibs
    nonJavafxLibs
}

// Fat JAR solo con dependencias no-JavaFX
jar {
    manifest {
        attributes 'Main-Class': 'presentation.main.MainLauncher'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { 
            !it.name.contains('javafx') 
        }.collect { it.isDirectory() ? it : zipTree(it) }
    }
    destinationDirectory = file('../EXE')
    archiveFileName = 'FormsApp.jar'
}

// Copiar JARs de JavaFX a EXE/lib
task copyJavaFXLibs(type: Copy) {
    from configurations.runtimeClasspath.filter { it.name.contains('javafx') }
    into '../EXE/lib'
}

jar.dependsOn copyJavaFXLibs

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['.']
            exclude '**/test/**'
        }
        resources {
            srcDirs = ['../DATA']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
        resources {
            srcDirs = ['test/data']
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    umlDoclet
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation('junit:junit:4.13.1')
    // UML Doclet para generar diagramas UML en JavaDoc
    umlDoclet 'nl.talsmasoftware:umldoclet:2.1.0'

    // Langchain4j for AI-powered features
    implementation platform('dev.langchain4j:langchain4j-bom:0.32.0')
    implementation 'dev.langchain4j:langchain4j'
    implementation 'dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2'
    testImplementation platform('dev.langchain4j:langchain4j-bom:0.32.0')
}

compileJava.dependsOn processResources

test {
    enabled = true
    workingDir = file('..')
}

// Copy compiled classes to EXE/classes
task copyClasses(type: Copy) {
    dependsOn classes
    from 'build/classes/java/main'
    into '../EXE/classes'
}

// Configure the run task
run {
    standardInput = System.in
}

// Make jar task also copy classes
jar.dependsOn copyClasses

// Create individual driver JARs
['SessionDriver', 'AppDriver', 'SurveyDriver', 'CreateSurveyDriver', 
 'MySurveysDriver', 'ResponseDriver', 'ClusteringDriver'].each { driver ->
    tasks.create("jar${driver}", Jar) {
        dependsOn copyClasses
        archiveBaseName = driver
        archiveVersion = ''
        destinationDirectory = file('../EXE/drivers')
        manifest {
            attributes 'Main-Class': "presentation.drivers.${driver}"
        }
        from sourceSets.main.output
    }
}

// Build all driver JARs
task buildDriverJars {
    dependsOn 'jarSessionDriver', 'jarAppDriver', 'jarSurveyDriver', 
              'jarCreateSurveyDriver', 'jarMySurveysDriver', 
              'jarResponseDriver', 'jarClusteringDriver'
    doLast {
        println "Driver JARs creados en EXE/drivers/"
    }
}

// Override assembleDist from application plugin
distributions {
    main {
        contents {
            from('../EXE') {
                include 'FormsApp.jar'
            }
            from('../DATA') {
                into 'DATA'
            }
        }
    }
}

// JavaDoc configuration
javadoc {
    source = sourceSets.main.allJava
    classpath = configurations.compileClasspath
    destinationDir = file('../DOC/javadoc')
    
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        author = true
        version = true
        links = [
            'https://docs.oracle.com/en/java/javase/21/docs/api/'
        ]
        addStringOption('Xdoclint:none', '-quiet')
        windowTitle = 'FormsApp Documentation'
        docTitle = 'FormsApp API Documentation'
        header = '<b>FormsApp</b>'
        
        // Configuración UMLDoclet para generar diagramas UML
        doclet = 'nl.talsmasoftware.umldoclet.UMLDoclet'
        docletpath = configurations.umlDoclet.files as List
        addBooleanOption 'createPumlFiles'
        addStringOption 'umlImageFormat', 'svg'
    }
    
    doLast {
        println "JavaDoc generado en ../DOC/javadoc/"
    }
}

// Task to generate JavaDoc and open it
task openJavadoc {
    dependsOn javadoc
    doLast {
        def javadocIndex = file('../DOC/javadoc/index.html')
        if (javadocIndex.exists()) {
            println "Abriendo JavaDoc en el navegador..."
            if (System.properties['os.name'].toLowerCase().contains('windows')) {
                exec { commandLine 'cmd', '/c', "start ${javadocIndex.absolutePath}" }
            } else if (System.properties['os.name'].toLowerCase().contains('mac')) {
                exec { commandLine 'open', javadocIndex.absolutePath }
            } else {
                exec { commandLine 'xdg-open', javadocIndex.absolutePath }
            }
        }
    }
}

// DriverMain task: ejecuta el menú principal de la aplicación en modo consola.
// Uso: ./gradlew DriverMain
// También se puede especificar otro driver: ./gradlew DriverMain -Pdriver=CreateSurveyDriver
tasks.register('DriverMain', JavaExec) {
    group = 'application'
    description = 'Run the main driver menu (K-SURVEY console application)'

    // Por defecto ejecuta presentation.driverMain.DriverMain
    // Si se pasa -Pdriver, ejecuta ese driver específico de presentation.drivers
    def driverProp = project.findProperty('driver')
    if (driverProp) {
        mainClass.set("presentation.drivers.${driverProp}")
    } else {
        mainClass.set("presentation.driverMain.DriverMain")
    }

    classpath = sourceSets.main.runtimeClasspath
    // permite interacción por consola
    standardInput = System.in
}

// Hacer que 'build' también compile todo correctamente para DriverMain
build.dependsOn compileJava
build.dependsOn 'jocs_proba'

// Tarea para ejecutar los juegos de prueba del DriverMain
tasks.register('jocs_proba') {
    group = 'verification'
    description = 'Ejecuta los juegos de prueba de todas las carpetas en EXE/tests usando DriverMain'
    dependsOn compileJava

    doLast {
        def testsDir = file('../EXE/tests')

        if (testsDir.exists()) {
            testsDir.eachDir { driverDir ->
                def inputDir = new File(driverDir, 'input')
                def outputDir = new File(driverDir, 'output')

                if (inputDir.exists()) {
                    // Crear directorio de salida si no existe
                    if (!outputDir.exists()) {
                        outputDir.mkdirs()
                    }

                    println "Procesando pruebas en: ${driverDir.name}"

                    inputDir.listFiles().each { inputFile ->
                        if (inputFile.name.endsWith('.txt')) {
                            def testName = inputFile.name
                            def outputFile = new File(outputDir, testName)

                            // Si el archivo de salida ya existe, lo eliminamos para asegurar que se reescribe
                            if (outputFile.exists()) {
                                outputFile.delete()
                            }

                            println "  Ejecutando test: ${testName}..."

                            javaexec {
                                mainClass = 'presentation.driverMain.DriverMain'
                                classpath = sourceSets.main.runtimeClasspath
                                standardInput = new FileInputStream(inputFile)
                                standardOutput = new FileOutputStream(outputFile)
                            }
                        }
                    }
                }
            }
            println "Todos los juegos de prueba han sido ejecutados."
        } else {
            println "No se encontró el directorio de tests: ${testsDir.path}"
        }
    }
}

// Configurar clean para eliminar también los outputs de los tests
clean.doLast {
    def testsDir = file('../EXE/tests')
    if (testsDir.exists()) {
        testsDir.eachDir { driverDir ->
            def outputDir = new File(driverDir, 'output')
            if (outputDir.exists()) {
                println "Eliminando outputs en: ${driverDir.name}"
                delete outputDir
            }
        }
    }
}
