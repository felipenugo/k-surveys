plugins {
    id 'java'
    id 'application'
}

group = 'presentation.driverMain'
version = '1.0-SNAPSHOT'

ext {
    javaMainClass = 'presentation.driverMain.DriverMain'
    javafxVersion = '21'
    javafxPlatform = 'win'
}

application {
    mainClass = javaMainClass
}

jar {
    manifest {
        attributes 'Main-Class': javaMainClass
    }
    from sourceSets.main.output
    destinationDirectory = file('../EXE')
    archiveFileName = 'FormsApp.jar'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Forzar encoding UTF-8 en compilación para evitar errores de caracteres especiales en Windows
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Also asegurar que las tareas de javadoc usan UTF-8
tasks.withType(Javadoc).configureEach {
    options.addStringOption('encoding', 'UTF-8')
}

// Arreglar dependencias de tareas
tasks.named('compileJava').configure {
    dependsOn 'processResources'
}

sourceSets {
    main {
        java {
            srcDirs = ['.']
            exclude '**/test/**'
        }
        resources {
            srcDirs = ['../resources']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
        resources {
            srcDirs = ['test/resources']
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    umlDoclet
}

// Dependencias
dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation('junit:junit:4.13.1')
    umlDoclet 'nl.talsmasoftware:umldoclet:2.1.0'

    // JavaFX - todas las dependencias necesarias para Windows
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-base:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-swing:${javafxVersion}:${javafxPlatform}"
}

// Copy compiled classes to EXE/classes
task copyClasses(type: Copy) {
    dependsOn classes
    from 'build/classes/java/main'
    into '../EXE/classes'
}

// Configure the run task
run {
    standardInput = System.in
}

// Make jar task also copy classes
jar.dependsOn copyClasses

// Create individual driver JARs
['SessionDriver', 'AppDriver', 'SurveyDriver', 'CreateSurveyDriver', 
 'MySurveysDriver', 'ResponseDriver', 'ClusteringDriver'].each { driver ->
    tasks.create("jar${driver}", Jar) {
        dependsOn copyClasses
        archiveBaseName = driver
        archiveVersion = ''
        destinationDirectory = file('../EXE/drivers')
        manifest {
            attributes 'Main-Class': "presentation.drivers.${driver}"
        }
        from sourceSets.main.output
    }
}

// Build all driver JARs
task buildDriverJars {
    dependsOn 'jarSessionDriver', 'jarAppDriver', 'jarSurveyDriver', 
              'jarCreateSurveyDriver', 'jarMySurveysDriver', 
              'jarResponseDriver', 'jarClusteringDriver'
    doLast {
        println "Driver JARs creados en EXE/drivers/"
    }
}

// Override assembleDist from application plugin
distributions {
    main {
        contents {
            from('../EXE') {
                include 'FormsApp.jar'
            }
            from('../DATA') {
                into 'DATA'
            }
        }
    }
}

// JavaDoc configuration
javadoc {
    source = sourceSets.main.allJava
    classpath = configurations.compileClasspath
    destinationDir = file('../DOC/javadoc')
    
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        author = true
        version = true
        links = [
            'https://docs.oracle.com/en/java/javase/21/docs/api/'
        ]
        addStringOption('Xdoclint:none', '-quiet')
        windowTitle = 'FormsApp Documentation'
        docTitle = 'FormsApp API Documentation'
        header = '<b>FormsApp</b>'
        
        // Configuración UMLDoclet para generar diagramas UML
        doclet = 'nl.talsmasoftware.umldoclet.UMLDoclet'
        docletpath = configurations.umlDoclet.files as List
        addBooleanOption 'createPumlFiles'
        addStringOption 'umlImageFormat', 'svg'
    }
    
    doLast {
        println "JavaDoc generado en ../DOC/javadoc/"
    }
}

// Task to generate JavaDoc and open it
task openJavadoc {
    dependsOn javadoc
    doLast {
        def javadocIndex = file('../DOC/javadoc/index.html')
        if (javadocIndex.exists()) {
            println "Abriendo JavaDoc en el navegador..."
            if (System.properties['os.name'].toLowerCase().contains('windows')) {
                exec { commandLine 'cmd', '/c', "start ${javadocIndex.absolutePath}" }
            } else if (System.properties['os.name'].toLowerCase().contains('mac')) {
                exec { commandLine 'open', javadocIndex.absolutePath }
            } else {
                exec { commandLine 'xdg-open', javadocIndex.absolutePath }
            }
        }
    }
}

// --- Tareas para ejecutar drivers y App individualmente desde IntelliJ/Gradle ---
import org.gradle.api.tasks.JavaExec

// DriverMain (interfaz de línea de comandos)
tasks.register('runDriverMain', JavaExec) {
    group = 'application'
    description = 'Ejecuta DriverMain (interfaz CLI)'
    mainClass = 'presentation.driverMain.DriverMain'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
}

// MainView (GUI con JavaFX)
tasks.register('runMainView', JavaExec) {
    group = 'application'
    description = 'Ejecuta MainView (GUI con JavaFX)'
    mainClass = 'presentation.main.MainView'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
    // Configurar módulos de JavaFX correctamente
    doFirst {
        def javafxModulesPath = configurations.runtimeClasspath.files.findAll {
            it.name.contains('javafx')
        }.collect { it.absolutePath }.join(File.pathSeparator)

        if (javafxModulesPath) {
            jvmArgs = [
                '--module-path', javafxModulesPath,
                '--add-modules', 'javafx.controls,javafx.fxml,javafx.graphics'
            ]
        }
    }
}

// Drivers individuales
['SessionDriver', 'AppDriver', 'SurveyDriver', 'CreateSurveyDriver',
 'MySurveysDriver', 'ResponseDriver', 'ClusteringDriver'].each { driver ->
    tasks.register("run${driver}", JavaExec) {
        group = 'application'
        description = "Ejecuta el driver ${driver}"
        mainClass = "presentation.drivers.${driver}"
        classpath = sourceSets.main.runtimeClasspath
        standardInput = System.in
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        })
    }
}

