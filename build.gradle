plugins {
    id 'java'
    id 'application'
}
// Indicates the package that contains the main class
group = 'presentation.driverMain'
version = '1.0-SNAPSHOT'

ext {
    javaMainClass = 'presentation.driverMain.DriverMain'
}

application {
    mainClassName = javaMainClass
}

jar {
    manifest {
        attributes 'Main-Class': javaMainClass
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            exclude '**/excluded/**'
        }
    }
}

repositories {
    mavenCentral()
}
dependencies {
    // this is just an example of importing an external library, you do not need to use it in your project
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation('junit:junit:4.13.1')
}
