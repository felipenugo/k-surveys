plugins {
    id 'java'
    id 'application'
}
// Indicates the package that contains the main class
group = 'presentation.driverMain'
version = '1.0-SNAPSHOT'

ext {
    javaMainClass = 'presentation.driverMain.DriverMain'
}

application {
    mainClassName = javaMainClass
}

jar {
    manifest {
        attributes 'Main-Class': javaMainClass
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            // Use FONT directory as the primary source directory so the repo's layout
            // follows the provided template (FONT contains the Java source code).
            srcDirs = ['FONT']
            exclude '**/excluded/**'
        }
    }
}

repositories {
    mavenCentral()
}
dependencies {
    // this is just an example of importing an external library, you do not need to use it in your project
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation('junit:junit:4.13.1')
}

// Task to copy compiled .class files to EXE/classes so they match the template structure
task copyClassesToExe(type: Copy) {
    dependsOn classes
    from('build/classes/java/main')
    into('EXE/classes')
    include('**/*.class')
}

// Ensure the task runs on assemble if desired
assemble.dependsOn(copyClassesToExe)

// Task para ejecutar con redirección de archivos usando exec
task runWithFiles(type: JavaExec) {
    group = 'application'
    description = 'Run the main class with optional input/output file redirection'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = javaMainClass
    
    // Configure input from file
    if (project.hasProperty('inputFile')) {
        def inputFilePath = project.property('inputFile')
        def inputFile = file(inputFilePath)
        if (inputFile.exists()) {
            standardInput = inputFile.newInputStream()
        } else {
            println "Warning: Input file '${inputFilePath}' not found"
        }
    } else {
        standardInput = System.in
    }
    
    // Configure output to file
    if (project.hasProperty('outputFile')) {
        def outputFilePath = project.property('outputFile')
        def outputFile = file(outputFilePath)
        standardOutput = outputFile.newOutputStream()
    }
}

// Configure the standard run task
run {
    standardInput = System.in
}
